# =============================================================================
# Profilo DEV - Sviluppo con connessione reale a UAT pagoPA
# =============================================================================
# Attivare con: spring.profiles.active=dev
#
# FLUSSO REALE:
#   Postman/SoapUI (simula SIL)
#     → POST http://localhost:8080/pu/sil/soap/reconciliation/PagamentiTelematiciPagatiRiconciliati
#       → ReconciliationEndpoint (Spring WS)
#         → PiattaformaUnitariaClient
#           → POST https://api.uat.p4pa.pagopa.it/pu/auth/oauth/token (token reale)
#           → POST https://api.uat.p4pa.pagopa.it/pu/sil/soap/reconciliation/...
#         → risposta reale al SIL
#
# CREDENZIALI:
#   Le credenziali OAuth2 vengono lette da variabili d'ambiente o dal file .env
#   (il file .env è incluso nel .gitignore e NON viene committato).
#   - PIATTAFORMA_CLIENT_ID
#   - PIATTAFORMA_CLIENT_SECRET

# --- Database PA (PostgreSQL) ---
spring:
  datasource:
    pa:
      driver-class-name: org.postgresql.Driver
      url: ${DB_PA_URL:jdbc:postgresql://localhost:5432/mypay_local_copy}
      username: ${DB_PA_USERNAME:admin}
      password: ${DB_PA_PASSWORD:admin}
      hikari:
        minimum-idle: 1
        maximum-pool-size: 5
        pool-name: HikariPool-PA-dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: mypay4

# --- Piattaforma Unitaria: ambiente UAT reale ---
piattaforma-unitaria:
  base-url: https://api.uat.p4pa.pagopa.it
  auth:
    token-url: ${piattaforma-unitaria.base-url}/pu/auth/oauth/token
    client-id: ${PIATTAFORMA_CLIENT_ID:SELC_99999000013SIL_RegLomb2}
    client-secret: ${PIATTAFORMA_CLIENT_SECRET:xxxxx}

# --- Logging piu verboso in sviluppo ---
logging:
  level:
    it.ariaspa.mypay: DEBUG
    org.springframework.ws: DEBUG
    org.springframework.web.client: DEBUG

# --- Actuator: dettagli sempre visibili in dev ---
management:
  endpoint:
    health:
      show-details: always
      show-components: always
  endpoints:
    web:
      exposure:
        include: "*"

# --- Resilience4j: parametri rilassati per sviluppo ---
resilience4j:
  circuitbreaker:
    instances:
      piattaformaUnitaria:
        sliding-window-size: 5
        failure-rate-threshold: 80
        wait-duration-in-open-state: 10s
  retry:
    instances:
      piattaformaUnitaria:
        max-attempts: 2
        wait-duration: 500ms

# --- SpringLine2 Security ---
# I SIL si autenticano tramite codIpaEnte + password nel body SOAP,
# NON tramite Bearer token JWT. Il JWT di SpringLine2 deve essere
# disabilitato sugli endpoint SOAP in ingresso.
# Il middleware gestisce internamente il token OAuth2 verso la PU.
spl:
  security:
    authentication:
      anonymous:
        enabled: true
        uri-matchers: /**
      jwt:
        enabled: false
        uri-matchers: /pu/sil/soap/**
      propagator:
        enabled: false
        uri-matchers: /pu/sil/soap/**
