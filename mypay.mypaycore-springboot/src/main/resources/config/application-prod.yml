# =============================================================================
# Profilo PROD - Produzione
# =============================================================================
# Attivare con: spring.profiles.active=prod
#
# ATTENZIONE: In produzione tutte le credenziali DEVONO essere fornite
# tramite variabili d'ambiente o vault, MAI hardcoded.

piattaforma-unitaria:
  base-url: ${PIATTAFORMA_BASE_URL}
  auth:
    token-url: ${piattaforma-unitaria.base-url}/pu/auth/oauth/token
    client-id: ${PIATTAFORMA_CLIENT_ID}
    client-secret: ${PIATTAFORMA_CLIENT_SECRET}

logging:
  level:
    it.ariaspa.mypay: INFO
    org.springframework.ws: ERROR
    root: WARN

# Actuator: solo health e info esposti, dettagli nascosti
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

# Resilience4j: parametri piu conservativi in produzione
resilience4j:
  circuitbreaker:
    instances:
      piattaformaUnitaria:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      piattaformaUnitaria:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2

# Sicurezza: cypher-secret DEVE essere sovrascritto
spl:
  security:
    jwt:
      cypher-secret: ${SPL_JWT_CYPHER_SECRET}
