
# =============================================================================
# Configurazione applicativa - mypay.mypaycore Middleware
# =============================================================================

# --- Disabilitare DataSource (Fase 1: no persistenza DB) ---
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# --- Piattaforma Unitaria (pagoPA) ---
piattaforma-unitaria:
  base-url: https://api.uat.p4pa.pagopa.it
  auth:
    token-url: ${piattaforma-unitaria.base-url}/pu/auth/oauth/token
    client-id: ${PIATTAFORMA_CLIENT_ID:SELC_99999000013SIL_RegLomb2}
    client-secret: ${PIATTAFORMA_CLIENT_SECRET:xxxxx}
    grant-type: client_credentials
    scope: openid

# --- Resilience4j ---
resilience4j:
  # Circuit Breaker per la comunicazione con la Piattaforma Unitaria
  circuitbreaker:
    instances:
      piattaformaUnitaria:
        # Apre il circuito dopo il 50% di fallimenti su una finestra di 10 chiamate
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        # Attende 30 secondi prima di tentare il passaggio da OPEN a HALF_OPEN
        wait-duration-in-open-state: 30s
        # Numero di chiamate permesse in stato HALF_OPEN per testare la ripresa
        permitted-number-of-calls-in-half-open-state: 3
        # Registra come fallimento anche le eccezioni di timeout
        record-exceptions:
          - it.ariaspa.mypay.mypaycore.api.common.exception.PiattaformaCommunicationException
          - org.springframework.web.client.ResourceAccessException
        # NON registrare errori di autenticazione (gestiti con refresh token)
        ignore-exceptions:
          - it.ariaspa.mypay.mypaycore.api.common.exception.PiattaformaAuthenticationException
  # Retry con backoff esponenziale per errori temporanei
  retry:
    instances:
      piattaformaUnitaria:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Riprova solo su errori di comunicazione (non su errori 4xx)
        retry-exceptions:
          - it.ariaspa.mypay.mypaycore.api.common.exception.PiattaformaCommunicationException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - it.ariaspa.mypay.mypaycore.api.common.exception.PiattaformaAuthenticationException

# --- Spring Boot Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  health:
    circuitbreakers:
      enabled: true

# --- SpringLine2 ---
spl:
  security:
    jwt:
      cypher-secret: vdfcvevj56h90547892d678034f78934f
      token-validity: 180000
    authentication:
      anonymous:
        enabled: true
        uri-matchers: /favicon.ico,/swagger-ui/**,/v3/api-docs/**,/actuator/health
      # Validazione Bearer token per le richieste SOAP dai SIL
      jwt:
        enabled: true
        uri-matchers: /pu/sil/soap/**
      propagator:
        enabled: true
        uri-matchers: /pu/sil/soap/**
  # Logging MON/MON-APP per tracciabilita richieste
  http:
    logging:
      mon.enabled: true
      app.enabled: true
  client-rest:
    logging:
      mon.enabled: true
      app.enabled: true
