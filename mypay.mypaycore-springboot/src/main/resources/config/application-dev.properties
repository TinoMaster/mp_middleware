# =============================================================================
# Profilo DEV - Sviluppo locale con connessione reale a UAT pagoPA
# =============================================================================
# Attivare con: spring.profiles.active=dev
#
# FLUSSO REALE:
#   Postman/SoapUI (simula SIL)
#     -> POST http://localhost:8080/pu/sil/soap/reconciliation/PagamentiTelematiciPagatiRiconciliati
#       -> ReconciliationEndpoint (Spring WS)
#         -> PiattaformaUnitariaClient
#           -> POST https://api.uat.p4pa.pagopa.it/pu/auth/oauth/token (token reale)
#           -> POST https://api.uat.p4pa.pagopa.it/pu/sil/soap/reconciliation/...
#         -> risposta reale al SIL
#
# CREDENZIALI:
#   Le credenziali OAuth2 vengono lette da variabili d'ambiente o dal file .env
#   (il file .env e' incluso nel .gitignore e NON viene committato).
#   - PIATTAFORMA_CLIENT_ID
#   - PIATTAFORMA_CLIENT_SECRET

# --- Database PA (PostgreSQL locale) ---
spring.datasource.pa.driver-class-name=org.postgresql.Driver
spring.datasource.pa.url=${DB_PA_URL:jdbc:postgresql://localhost:5432/mypay_local_copy}
spring.datasource.pa.username=${DB_PA_USERNAME:admin}
spring.datasource.pa.password=${DB_PA_PASSWORD:admin}
spring.datasource.pa.hikari.minimum-idle=1
spring.datasource.pa.hikari.maximum-pool-size=5
spring.datasource.pa.hikari.pool-name=HikariPool-PA-dev

# --- JPA: SQL visibile in sviluppo ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=mypay4

# --- Piattaforma Unitaria: ambiente UAT reale ---
piattaforma-unitaria.base-url=https://api.uat.p4pa.pagopa.it
piattaforma-unitaria.auth.token-url=${piattaforma-unitaria.base-url}/pu/auth/oauth/token
piattaforma-unitaria.auth.client-id=${PIATTAFORMA_CLIENT_ID:SELC_99999000013SIL_RegLomb2}
piattaforma-unitaria.auth.client-secret=${PIATTAFORMA_CLIENT_SECRET:xxxxx}

# --- Logging piu' verboso in sviluppo ---
logging.level.it.ariaspa.mypay=DEBUG
logging.level.org.springframework.ws=DEBUG
logging.level.org.springframework.web.client=DEBUG

# --- Actuator: dettagli sempre visibili in dev ---
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=*

# --- Resilience4j: parametri rilassati per sviluppo ---
resilience4j.circuitbreaker.instances.piattaformaUnitaria.sliding-window-size=5
resilience4j.circuitbreaker.instances.piattaformaUnitaria.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.piattaformaUnitaria.wait-duration-in-open-state=10s
resilience4j.retry.instances.piattaformaUnitaria.max-attempts=2
resilience4j.retry.instances.piattaformaUnitaria.wait-duration=500ms

# --- SpringLine2 Security ---
# I SIL si autenticano tramite codIpaEnte + password nel body SOAP,
# NON tramite Bearer token JWT. Il JWT di SpringLine2 deve essere
# disabilitato sugli endpoint SOAP in ingresso.
# Il middleware gestisce internamente il token OAuth2 verso la PU.
spl.security.authentication.anonymous.enabled=true
spl.security.authentication.anonymous.uri-matchers=/**
spl.security.authentication.jwt.enabled=false
spl.security.authentication.jwt.uri-matchers=/pu/sil/soap/**
spl.security.authentication.propagator.enabled=false
spl.security.authentication.propagator.uri-matchers=/pu/sil/soap/**
