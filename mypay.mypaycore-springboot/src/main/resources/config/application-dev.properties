# =============================================================================
# Profilo DEV - Sviluppo locale con connessione reale a UAT pagoPA
# =============================================================================
# Attivare con: spring.profiles.active=dev
#
# FLUSSO REALE (esempio riconciliazione via PU):
#   Postman/SoapUI (simula SIL)
#     -> POST http://localhost:8086/ws/pivot/PagamentiTelematiciPagatiRiconciliati
#       -> ReconciliationEndpoint (Spring WS)
#         -> RoutingDecisionService (DB lookup)
#           -> [PIATTAFORMA_UNITARIA] PiattaformaUnitariaClient (OAuth2)
#           -> [LEGACY]              ProxyForwardingClient (forward diretto)
#         -> risposta al SIL
#
# CREDENZIALI:
#   Le credenziali OAuth2 (client_id e client_secret) sono per-ente e vengono
#   lette dalla tabella mygov_ente_config_pu nel database PA.

# --- Server applicativo locale ---
server.port=${SERVER_PORT:8086}

# --- Database PA (PostgreSQL locale) ---
spring.datasource.pa.driver-class-name=org.postgresql.Driver
spring.datasource.pa.url=${DB_PA_URL:jdbc:postgresql://10.199.144.62:5432/mypay4.pa}
spring.datasource.pa.username=${DB_PA_USERNAME:mypay4.pa}
spring.datasource.pa.password=${DB_PA_PASSWORD:mypay4.pa}
#spring.datasource.pa.url=${DB_PA_URL:jdbc:postgresql://localhost:5432/mypay_local_copy}
#spring.datasource.pa.username=${DB_PA_USERNAME:admin}
#spring.datasource.pa.password=${DB_PA_PASSWORD:admin}
spring.datasource.pa.hikari.minimumIdle=1
spring.datasource.pa.hikari.maximumPoolSize=5
spring.datasource.pa.hikari.pool-name=HikariPool-PA-dev

# --- Piattaforma Unitaria: ambiente UAT reale ---
piattaforma-unitaria.base-url=https://api.uat.p4pa.pagopa.it
piattaforma-unitaria.auth.token-url=${piattaforma-unitaria.base-url}/pu/auth/oauth/token

# --- Backend legacy: URL di sviluppo locale ---
backend.mypay.base-url=${BACKEND_MYPAY_URL:http://localhost:8080}
backend.mypivot.base-url=${BACKEND_MYPIVOT_URL:http://localhost:8081}

# --- Cache configurazione enti: TTL breve in dev per vedere subito le modifiche ---
middleware.cache.ente-config.ttl-seconds=60

# --- Logging piu' verboso in sviluppo ---
logging.level.it.ariaspa.mypay=DEBUG
logging.level.org.springframework.ws=DEBUG
logging.level.org.springframework.web.client=DEBUG

# --- Actuator: dettagli sempre visibili in dev ---
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=*

# --- Resilience4j: parametri rilassati per sviluppo ---
resilience4j.circuitbreaker.instances.piattaformaUnitaria.sliding-window-size=5
resilience4j.circuitbreaker.instances.piattaformaUnitaria.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.piattaformaUnitaria.wait-duration-in-open-state=10s
resilience4j.retry.instances.piattaformaUnitaria.max-attempts=2
resilience4j.retry.instances.piattaformaUnitaria.wait-duration=500ms
# Backend legacy: stessi parametri rilassati
resilience4j.circuitbreaker.instances.backendLegacy.sliding-window-size=5
resilience4j.circuitbreaker.instances.backendLegacy.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.backendLegacy.wait-duration-in-open-state=10s
resilience4j.retry.instances.backendLegacy.max-attempts=2
resilience4j.retry.instances.backendLegacy.wait-duration=500ms

# --- SpringLine2 Security ---
# I SIL si autenticano tramite codIpaEnte + password nel body SOAP,
# NON tramite Bearer token JWT. Il JWT di SpringLine2 deve essere
# disabilitato sugli endpoint SOAP in ingresso.
# Il middleware gestisce internamente il token OAuth2 verso la PU.
spl.security.authentication.anonymous.enabled=true
spl.security.authentication.anonymous.uri-matchers=/**
spl.security.authentication.jwt.enabled=false
spl.security.authentication.jwt.uri-matchers=/ws/**
spl.security.authentication.propagator.enabled=false
spl.security.authentication.propagator.uri-matchers=/ws/**

# --- Configurazione aggiuntiva ---
spring-line.version=2027.01.01
spring.application.name=middleware

# --- Configurazione logging ---
logging.level.root=INFO
logging.level.it.ariaspa.mypay.mypaycore.api.=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.ws.server.MessageTracing=${LOGLEVEL_MESSAGETRACING:${logging.level.root}}
logging.level.org.springframework.ws.client.MessageTracing=${LOGLEVEL_MESSAGETRACING:${logging.level.root}}

# --- Logback: posizione del file di configurazione e directory log ---
logging.config=../mypay.mypaycore-properties/src/main/resources/logback-spring.xml
logging.file.dir=C:\\app\\mypay\\middleware\\log
