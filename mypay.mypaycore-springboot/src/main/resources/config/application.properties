# =============================================================================
# Configurazione applicativa - mypay.mypaycore Middleware
# Configurazione base comune a tutti i profili
# =============================================================================

# --- Piattaforma Unitaria (pagoPA) ---
piattaforma-unitaria.base-url=https://api.uat.p4pa.pagopa.it
piattaforma-unitaria.auth.token-url=${piattaforma-unitaria.base-url}/pu/auth/oauth/token
piattaforma-unitaria.auth.client-id=${PIATTAFORMA_CLIENT_ID:SELC_99999000013SIL_RegLomb2}
piattaforma-unitaria.auth.client-secret=${PIATTAFORMA_CLIENT_SECRET:xxxxx}
piattaforma-unitaria.auth.grant-type=client_credentials
piattaforma-unitaria.auth.scope=openid

# --- Resilience4j: Circuit Breaker ---
# Apre il circuito dopo il 50% di fallimenti su una finestra di 10 chiamate
resilience4j.circuitbreaker.instances.piattaformaUnitaria.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.piattaformaUnitaria.sliding-window-size=10
resilience4j.circuitbreaker.instances.piattaformaUnitaria.failure-rate-threshold=50
# Attende 30 secondi prima di tentare il passaggio da OPEN a HALF_OPEN
resilience4j.circuitbreaker.instances.piattaformaUnitaria.wait-duration-in-open-state=30s
# Numero di chiamate permesse in stato HALF_OPEN per testare la ripresa
resilience4j.circuitbreaker.instances.piattaformaUnitaria.permitted-number-of-calls-in-half-open-state=3
# Registra come fallimento anche le eccezioni di timeout
resilience4j.circuitbreaker.instances.piattaformaUnitaria.record-exceptions[0]=it.ariaspa.mypay.mypaycore.api.common.exception.PiattaformaCommunicationException
resilience4j.circuitbreaker.instances.piattaformaUnitaria.record-exceptions[1]=org.springframework.web.client.ResourceAccessException
# NON registrare errori di autenticazione (gestiti con refresh token)
resilience4j.circuitbreaker.instances.piattaformaUnitaria.ignore-exceptions[0]=it.ariaspa.mypay.mypaycore.api.common.exception.PiattaformaAuthenticationException

# --- Resilience4j: Retry con backoff esponenziale per errori temporanei ---
resilience4j.retry.instances.piattaformaUnitaria.max-attempts=3
resilience4j.retry.instances.piattaformaUnitaria.wait-duration=1s
resilience4j.retry.instances.piattaformaUnitaria.enable-exponential-backoff=true
resilience4j.retry.instances.piattaformaUnitaria.exponential-backoff-multiplier=2
# Riprova solo su errori di comunicazione (non su errori 4xx)
resilience4j.retry.instances.piattaformaUnitaria.retry-exceptions[0]=it.ariaspa.mypay.mypaycore.api.common.exception.PiattaformaCommunicationException
resilience4j.retry.instances.piattaformaUnitaria.retry-exceptions[1]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.piattaformaUnitaria.ignore-exceptions[0]=it.ariaspa.mypay.mypaycore.api.common.exception.PiattaformaAuthenticationException

# --- Spring Boot Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,retries
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.health.circuitbreakers.enabled=true

# --- SpringLine2 ---
# Chiave di cifratura per i token JWT interni
spl.security.jwt.cypher-secret=vdfcvevj56h90547892d678034f78934f
spl.security.jwt.token-validity=180000
# Endpoint pubblici: favicon, Swagger UI, OpenAPI docs, health check
spl.security.authentication.anonymous.enabled=true
spl.security.authentication.anonymous.uri-matchers=/favicon.ico,/swagger-ui/**,/v3/api-docs/**,/actuator/health
# Validazione Bearer token per le richieste SOAP dai SIL
spl.security.authentication.jwt.enabled=true
spl.security.authentication.jwt.uri-matchers=/pu/sil/soap/**
spl.security.authentication.propagator.enabled=true
spl.security.authentication.propagator.uri-matchers=/pu/sil/soap/**
# Logging MON/MON-APP per tracciabilita richieste
spl.http.logging.mon.enabled=true
spl.http.logging.app.enabled=true
spl.client-rest.logging.mon.enabled=true
spl.client-rest.logging.app.enabled=true
