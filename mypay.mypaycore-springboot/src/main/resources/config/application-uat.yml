# --- Database PA (PostgreSQL) ---
spring:
  datasource:
    pa:
      driver-class-name: org.postgresql.Driver
      url: ${DB_PA_URL}
      username: ${DB_PA_USERNAME}
      password: ${DB_PA_PASSWORD}
      hikari:
        minimum-idle: 2
        maximum-pool-size: 10
        pool-name: HikariPool-PA-uat

piattaforma-unitaria:
  base-url: https://api.uat.p4pa.pagopa.it
  auth:
    token-url: ${piattaforma-unitaria.base-url}/pu/auth/oauth/token
    client-id: ${PIATTAFORMA_CLIENT_ID}
    client-secret: ${PIATTAFORMA_CLIENT_SECRET}

logging:
  level:
    it.ariaspa.mypay: INFO
    org.springframework.ws: WARN

# Actuator: dettagli solo per utenti autorizzati
management:
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
