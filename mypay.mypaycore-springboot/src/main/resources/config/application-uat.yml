# =============================================================================
# Profilo UAT - User Acceptance Testing
# =============================================================================
# Attivare con: spring.profiles.active=uat

piattaforma-unitaria:
  base-url: https://api.uat.p4pa.pagopa.it
  auth:
    token-url: ${piattaforma-unitaria.base-url}/pu/auth/oauth/token
    client-id: ${PIATTAFORMA_CLIENT_ID}
    client-secret: ${PIATTAFORMA_CLIENT_SECRET}

logging:
  level:
    it.ariaspa.mypay: INFO
    org.springframework.ws: WARN

# Actuator: dettagli solo per utenti autorizzati
management:
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
