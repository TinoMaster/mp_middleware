# =============================================================================
# Configurazione bootstrap - mypay.mypaycore
# Completare tutti i valori <INSERIRE ...> prima del deploy
# =============================================================================

# Nome applicazione
spring.application.name=mypay.mypaycore

# Indirizzo IP del server
server.address=<INSERIRE INDIRIZZO IP>

# Keystore per la cifratura dei segreti
encrypt.keyStore.alias=aliaskey
encrypt.keyStore.location=file:certs/mypay.mypaycore.jks
encrypt.keyStore.password=<PASSWORD DEL KEYSTORE, COME IN CREAZIONE DEL KEYSTORE>
encrypt.keyStore.secret=<PASSWORD DELLA CHIAVE, COME IN CREAZIONE DEL KEYSTORE>

# Directory di output dei log
logging.file.path=logs
